name: Generate Release (Manual)

on:
  workflow_dispatch:
    inputs:
      variants:
        description: "Comma-delimited list of variants to generate releases for (blank = all enabled; only missing version tags are released)"
        type: string
        required: false
        default: ""
      handwritten:
        description: "Optional changelog note to prepend"
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  resolve-variants:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve variants
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source scripts/just-helpers.bash
          VARIANTS=$(resolve_release_variants "${{ inputs.variants }}" ".github/variants.json")
          [ -n "$VARIANTS" ] || { echo "::error::No valid variants to process"; exit 1; }
          MATRIX_JSON=$(echo "$VARIANTS" | jq -R . | jq -sc .)
          {
            echo "matrix<<EOF"
            echo "$MATRIX_JSON"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved variants: $MATRIX_JSON"

  generate-release:
    needs: resolve-variants
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        variant: ${{ fromJSON(needs.resolve-variants.outputs.matrix) }}
      fail-fast: false
    concurrency:
      group: generate-release-${{ matrix.variant }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout last 500 commits
        uses: actions/checkout@v7
        with:
          fetch-depth: 500

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          github-token: ${{ secrets.MY_GITHUB_TOKEN }}

      - name: Generate release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: just release "${{ matrix.variant }}" "${{ inputs.handwritten }}" ".github/variants.json" true
