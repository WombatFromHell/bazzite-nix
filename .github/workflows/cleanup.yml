name: Clean Old Images

on:
  schedule:
    - cron: "0 0 * * 0" # Runs at 00:00 UTC every Sunday
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run mode (safe: no deletions)"
        type: boolean
        default: true
      package_filter:
        description: "Comma-separated list of full package names to process (empty = all cleanup-enabled)"
        type: string
        default: ""

env:
  # Scheduled runs default to live mode; manual runs respect dry_run input
  DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || (inputs.dry_run == true && 'true' || 'false') }}

jobs:
  prepare:
    runs-on: ubuntu-26.04
    outputs:
      packages: ${{ steps.variants.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build package matrix
        id: variants
        run: |
          source scripts/just-helpers.bash
          FILTER="${{ inputs.package_filter }}"
          packages="$(cleanup_packages "$GITHUB_REPOSITORY" .github/variants.json "$FILTER")"
          [ -n "$packages" ] || echo "::warning::package-filter '${FILTER}' matched no packages"
          echo "Packages to process:"
          echo "$packages"
          echo "packages=$(jq -Rnc '[inputs | select(length > 0)]' <<<"$packages")" >> "$GITHUB_OUTPUT"

  cleanup-images:
    needs: [prepare]
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.prepare.outputs.packages) }}

    # Prevent concurrent cleanup of same package
    concurrency:
      group: cleanup-image-${{ matrix.package }}
      cancel-in-progress: false

    permissions:
      packages: write

    steps:
      - name: Cleanup container images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: ${{ matrix.package }}
          older-than: 3 months
          keep-n-tagged: 78 # 13 weekly runs x 3 variants x 2 images per build
          delete-untagged: true
          delete-partial-images: true
          delete-orphaned-images: true
          dry-run: ${{ env.DRY_RUN }}
          log-level: info
