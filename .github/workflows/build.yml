name: Build Custom Image

on:
  schedule:
    - cron: "0 0 * * 0" # Runs at 00:00 UTC every Sunday
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build even if digest unchanged"
        required: false
        default: false
        type: boolean
      generate_release:
        description: "Generate GitHub release after build"
        required: false
        default: false
        type: boolean
      variants_override:
        description: "Override variants to build (comma delimited)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_DESC: "Customized Bazzite image with Nix mount support and other sugar"
  VARIANTS_CONFIG: ".github/variants.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check_and_aggregate:
    runs-on: ubuntu-26.04
    outputs:
      variants_to_build: ${{ steps.check.outputs.variants_to_build }}
      any_builds_needed: ${{ steps.check.outputs.any_builds_needed }}
      date: ${{ steps.refs.outputs.date }}
      registry: ${{ steps.refs.outputs.registry }}
      repo: ${{ steps.refs.outputs.repo }}
      image_desc: ${{ env.IMAGE_DESC }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare refs
        id: refs
        run: |
          source scripts/check-variants-registry.bash
          {
            echo "registry=$(registry_url "$GITHUB_REPOSITORY_OWNER")"
            echo "repo=$(package_repo)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Check variants
        id: check
        shell: bash
        run: |
          source scripts/just-helpers.bash
          REGISTRY="${{ steps.refs.outputs.registry }}" \
            REPO="${{ env.IMAGE_NAME }}" \
            IMAGE_DESC="${{ env.IMAGE_DESC }}" \
            DATE="${{ steps.refs.outputs.date }}" \
            FORCE_BUILD="${{ github.event.inputs.force_build == 'true' }}" \
            VARIANTS_CONFIG="${{ env.VARIANTS_CONFIG }}" \
            VARIANTS_OVERRIDE="${{ github.event.inputs.variants_override || '' }}" \
            bash scripts/check-variants.sh
          aggregate_variants "${{ steps.refs.outputs.registry }}" "${{ env.IMAGE_NAME }}"

      - name: Preview pending builds
        if: steps.check.outputs.any_builds_needed == 'true'
        shell: bash
        run: |
          source scripts/just-helpers.bash
          variants=$(echo '${{ steps.check.outputs.variants_to_build }}' | jq -r '[.[].variant] | join(",")')
          preview_tags "$variants" "${{ env.VARIANTS_CONFIG }}" "${{ env.IMAGE_NAME }}" "${{ github.repository_owner }}"

  build_push:
    needs: check_and_aggregate
    if: needs.check_and_aggregate.outputs.any_builds_needed == 'true'
    name: Build & Push ${{ matrix.variant_data.variant }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        variant_data: ${{ fromJson(needs.check_and_aggregate.outputs.variants_to_build) }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          github-token: ${{ secrets.MY_GITHUB_TOKEN }}

      - name: Build image
        id: build
        shell: bash
        run: |
          RECORD=$(jq -c \
            --arg date "${{ needs.check_and_aggregate.outputs.date }}" \
            --arg image_desc "${{ needs.check_and_aggregate.outputs.image_desc }}" \
            --arg repo_owner "${{ github.repository_owner }}" \
            --arg repo_name "${{ env.IMAGE_NAME }}" \
            '. + {date: $date, image_desc: $image_desc, repo_owner: $repo_owner, repo_name: $repo_name, version_label: .parent_version}' \
            <<< '${{ toJSON(matrix.variant_data) }}')
          just ci-pipeline "$RECORD" '{"rechunk":1}'

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Install oras
        uses: oras-project/setup-oras@v2

      - name: Push, sign, and verify image
        id: push_image
        shell: bash
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
          REGISTRY: ${{ needs.check_and_aggregate.outputs.registry }}
          REPO: ${{ needs.check_and_aggregate.outputs.repo }}
          DATE: ${{ needs.check_and_aggregate.outputs.date }}
        run: |
          RECORD='${{ steps.build.outputs.record }}'
          OPTIONS=$(jq -cn --arg registry "$REGISTRY" --arg repo "$REPO" --arg date "$DATE" '{registry: $registry, repo: $repo, date: $date}')
          just push "$RECORD" "$OPTIONS"

  collect_release_variants:
    needs: [check_and_aggregate, build_push]
    if: needs.check_and_aggregate.outputs.any_builds_needed == 'true'
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Collect variants to release
        id: collect
        run: |
          source scripts/just-helpers.bash
          BUILT_VARIANTS=$(echo '${{ needs.check_and_aggregate.outputs.variants_to_build }}' | jq -r '[.[].variant] | join(",")')
          MATRIX_JSON=$(release_matrix_json "$BUILT_VARIANTS" "${{ env.VARIANTS_CONFIG }}")
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"
          echo "Variants built this run with something to release: $MATRIX_JSON"

  generate_release:
    needs: [check_and_aggregate, build_push, collect_release_variants]
    if: |
      needs.collect_release_variants.outputs.matrix != '[]' &&
      (github.event.inputs.generate_release == 'true' || github.event_name == 'schedule')
    name: Generate Release ${{ matrix.variant }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    concurrency:
      group: generate-release-${{ matrix.variant }} # one queue per variant
      cancel-in-progress: false

    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.collect_release_variants.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 500

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          github-token: ${{ secrets.MY_GITHUB_TOKEN }}

      - name: Generate release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: just release "${{ matrix.variant }}" "" "${{ env.VARIANTS_CONFIG }}" true
