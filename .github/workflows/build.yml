name: Build Custom Image

on:
  schedule:
    - cron: "42 18 29,14 * *" # Runs at 18:42 UTC on the 29th and 14th of every month
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build even if digest unchanged"
        required: false
        default: false
        type: boolean
      generate_release:
        description: "Generate GitHub release after build"
        required: false
        default: false
        type: boolean
      variants_override:
        description: "Override variants to build (comma delimited)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_DESC: "Customized Bazzite image with Nix mount support and other sugar"
  VARIANTS_CONFIG: ".github/variants.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check_and_aggregate:
    runs-on: ubuntu-26.04
    outputs:
      variants_to_build: ${{ steps.check.outputs.variants_to_build }}
      any_builds_needed: ${{ steps.check.outputs.any_builds_needed }}
      date: ${{ steps.refs.outputs.date }}
      registry: ${{ steps.refs.outputs.registry }}
      repo: ${{ steps.refs.outputs.repo }}
      image_desc: ${{ env.IMAGE_DESC }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare refs
        id: refs
        run: |
          {
            echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
            echo "repo=${GITHUB_REPOSITORY#*/}"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Check variants
        id: check
        shell: bash
        run: |
          source scripts/just-helpers.bash
          REGISTRY="${{ steps.refs.outputs.registry }}" \
            REPO="${{ env.IMAGE_NAME }}" \
            IMAGE_DESC="${{ env.IMAGE_DESC }}" \
            DATE="${{ steps.refs.outputs.date }}" \
            FORCE_BUILD="${{ github.event.inputs.force_build == 'true' }}" \
            VARIANTS_CONFIG="${{ env.VARIANTS_CONFIG }}" \
            VARIANTS_OVERRIDE="${{ github.event.inputs.variants_override || '' }}" \
            bash scripts/check-variants.sh
          aggregate_variants "${{ steps.refs.outputs.registry }}" "${{ env.IMAGE_NAME }}"

      - name: Preview pending builds
        if: steps.check.outputs.any_builds_needed == 'true'
        shell: bash
        run: |
          source scripts/just-helpers.bash
          variants=$(echo '${{ steps.check.outputs.variants_to_build }}' | jq -r '[.[].variant] | join(",")')
          preview_tags "$variants" "${{ env.VARIANTS_CONFIG }}" "${{ env.IMAGE_NAME }}" "${{ github.repository_owner }}"

  build_push:
    needs: check_and_aggregate
    if: needs.check_and_aggregate.outputs.any_builds_needed == 'true'
    name: Build & Push ${{ matrix.variant_data.variant }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        variant_data: ${{ fromJson(needs.check_and_aggregate.outputs.variants_to_build) }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          github-token: ${{ secrets.MY_GITHUB_TOKEN }}

      - name: Build image
        id: build
        shell: bash
        run: |
          just ci-pipeline \
            "${{ matrix.variant_data.variant }}" \
            "${{ matrix.variant_data.base_image }}" \
            "${{ matrix.variant_data.build_script || 'build.sh' }}" \
            "${{ matrix.variant_data.canonical_tag }}" \
            "${{ matrix.variant_data.tags }}" \
            "${{ needs.check_and_aggregate.outputs.date }}" \
            "${{ needs.check_and_aggregate.outputs.image_desc }}" \
            "${{ matrix.variant_data.parent_version }}" \
            "1"

      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0

      - name: Push, sign, and verify image
        id: push_image
        shell: bash
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        run: |
          just push \
            "${{ steps.build.outputs.source_ref }}" \
            "${{ matrix.variant_data.tags }}" \
            "${{ needs.check_and_aggregate.outputs.registry }}" \
            "${{ needs.check_and_aggregate.outputs.repo }}" \
            "${{ matrix.variant_data.suffix }}" \
            "${{ matrix.variant_data.variant }}" \
            "${{ needs.check_and_aggregate.outputs.date }}" \
            "${{ matrix.variant_data.parent_version }}"

  collect_build_results:
    needs: [check_and_aggregate, build_push]
    if: needs.check_and_aggregate.outputs.any_builds_needed == 'true'
    runs-on: ubuntu-26.04
    outputs:
      successful_variants: ${{ steps.collect.outputs.successful_variants }}
      any_successful: ${{ steps.collect.outputs.any_successful }}
      registry: ${{ needs.check_and_aggregate.outputs.registry }}
      repo: ${{ needs.check_and_aggregate.outputs.repo }}
    steps:
      - name: Collect successful builds
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUCCESSFUL_VARIANTS=$(gh run view "${{ github.run_id }}" --json jobs --jq \
            '[.jobs[] | select(.name | startswith("Build & Push")) | select(.conclusion == "success") | {variant: (.name | sub("^Build & Push "; ""))}]')

          COUNT=$(echo "$SUCCESSFUL_VARIANTS" | jq 'length')
          echo "successful_variants=${SUCCESSFUL_VARIANTS}" >> "$GITHUB_OUTPUT"
          echo "any_successful=$([ "$COUNT" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Found $COUNT successful builds"

  generate_release:
    needs: [check_and_aggregate, build_push, collect_build_results]
    if: |
      needs.collect_build_results.outputs.any_successful == 'true' &&
      (github.event.inputs.generate_release == 'true' || github.event_name == 'schedule')
    name: Generate Release ${{ matrix.variant.variant }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    concurrency:
      group: generate-release-${{ matrix.variant.variant }}-${{ github.ref }}
      cancel-in-progress: false

    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.collect_build_results.outputs.successful_variants) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 500

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          github-token: ${{ secrets.MY_GITHUB_TOKEN }}

      - name: Generate release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: just release "${{ matrix.variant.variant }}" "" "${{ env.VARIANTS_CONFIG }}" true
