# Tighter than systemd's default (SwapUsedLimit=90%) and than Fedora's
# 10-oomd-defaults.conf (DefaultMemoryPressureDurationSec=20s): conf.d drop-ins sort
# lexicographically and the last single value wins, so 90- takes precedence.
# SwapUsedLimit= gates BOTH fractions - oomd acts on swap only when RAM-used AND swap-used
# both exceed it (systemd-oomd.5), so 87% means "swap-kill once ~1 GiB of an 8 GiB swapfile
# is left", and RAM is handled by the MemoryHigh= ceiling plus the pressure rules below.
# DefaultMemoryPressureLimit is left at systemd's 60% default; the per-unit limits set it.
[OOM]
SwapUsedLimit=87%
DefaultMemoryPressureDurationSec=15s
