# The session tree is the swap prefix: candidates are picked by swap usage, and oomd only
# honours ManagedOOMPreference= on swap candidates when the cgroup is owned by root, so marking
# a user-owned prefix here buys nothing. RAM pressure is monitored at app.slice instead, which
# is owned by the session UID - there, a user-owned avoid/omit is respected (systemd.resource-control.5).
[Slice]
ManagedOOMSwap=kill
