# Nothing in oomd bounds RAM: it reacts to PSI pressure and swap fractions. MemoryMax= is the
# ceiling that stops a RAM hog filling the machine, so the kernel OOM killer runs inside -.slice
# when it is reached. MemoryHigh= is the throttle band above which reclaim goes aggressive and
# pages spill to zswap and then to the swapfile. Percentages are relative to installed RAM, so
# one default holds on a 32GB host and on a small VM.
[Slice]
ManagedOOMSwap=kill
MemoryHigh=95%
MemoryMax=96.5%
