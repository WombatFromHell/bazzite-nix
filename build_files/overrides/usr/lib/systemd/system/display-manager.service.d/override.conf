# Keeps the login manager out of oomd's candidate list, and out of the kernel kill MemoryMax=
# falls back to (that path ignores ManagedOOMPreference, so OOMScoreAdjust= covers it). Named
# after the alias, so systemd applies it to whichever unit declares Alias=display-manager.service
# on the variant: plasmalogin, sddm or gdm. init.sh masks sddm.service.d/override.conf only, so
# this separate directory is untouched.
[Service]
ManagedOOMPreference=omit
OOMScoreAdjust=-1000
