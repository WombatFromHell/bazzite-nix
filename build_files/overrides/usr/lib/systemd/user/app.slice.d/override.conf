# Fedora marks every user slice kill at 80% (/usr/lib/systemd/user/slice.d/10-oomd-per-slice-defaults.conf).
# This cgroup is owned by the session UID, so avoid/omit set on units inside it are honoured;
# 40% beats Fedora's 80% because drop-ins load in lexicographic filename order and override.conf
# sorts after 10-. Candidates here are ordered by reclaim activity, so the RAM hog (Strata's
# scope, whose pgscan rate dwarfs everything else) is picked first.
[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=40%
